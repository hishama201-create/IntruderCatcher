name: Android CI Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare release keystore
        run: |
          mkdir -p app/keystore-release
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore-release/release.keystore
          cat > app/keystore-release/keystore.properties << PROPS
          STORE_FILE=keystore-release/release.keystore
          STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          PROPS

      - name: Print release SHA-1 fingerprint
        run: |
          keytool -list -v \
            -keystore app/keystore-release/release.keystore \
            -alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" | grep "SHA1:"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntruderCatcher-release-apk
          path: app/build/outputs/apk/release/*.apk
